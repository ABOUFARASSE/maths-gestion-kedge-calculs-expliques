const words = (text) => text.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().match(/[a-z0-9]+/g) ?? [];
const stop = new Set(words(
  "le la les de des du un une au aux en et ou avec sans pour par sur ce ces comment que quoi quels quel quelle quelles dois veux donne faire dans est ai as sont peut peux expliquer exemple mon ma mes ton ta tes il elle on je tu vous nous stata commande commandes code fichier fichiers variable variables modele modeles calculer obtenir erreur difference differences entre vs the what how do i of of my the can to in on using"
));
const tokens = (text) => [...new Set(words(text).filter((w) => w.length > 1 && !stop.has(w)))];
const entries = corpus.map((source) => ({
  source,
  title: new Set(tokens(source.title)),
  tags: new Set(tokens(source.tags)),
  text: new Set(tokens(source.note)),
}));
const frequencies = new Map();
for (const entry of entries) {
  for (const term of new Set([...entry.title, ...entry.tags, ...entry.text])) {
    frequencies.set(term, (frequencies.get(term) ?? 0) + 1);
  }
}

function retrieve(question, previous = "") {
  const terms = tokens(question);
  // Keep the previous topic for short follow-ups with no clear command name.
  const exactTitle = entries.some((e) => terms.some((term) => e.title.has(term)));
  const context = !exactTitle && terms.length <= 8 ? tokens(previous) : [];
  return entries.map((entry) => {
    const score = (list) => list.reduce((sum, term) => {
      const weight = entry.title.has(term) ? 5 : entry.tags.has(term) ? 3 : entry.text.has(term) ? 1 : 0;
      return sum + weight * Math.log(1 + entries.length / (1 + (frequencies.get(term) ?? 0)));
    }, 0);
    const direct = score(terms);
    return { source: entry.source, rank: direct + 0.35 * score(context), direct };
  }).filter((e) => e.rank >= 3 && (e.direct > 0 || context.length))
    .sort((a, b) => b.rank - a.rank)
    .slice(0, 5).map((e) => e.source);
}

      root.querySelector(".hint").hidden = true;
      root.querySelector(".eyebrow").textContent = "TEST TEMPORAIRE · RECHERCHE DOCUMENTAIRE";
      root.querySelector("header p").textContent = "Recherche dans les fiches Stata. Les réponses générées par IA seront disponibles après connexion du serveur.";
      send.textContent = "Chercher des sources";
    }
    root.querySelectorAll(".examples button").forEach((button, i) => {
      button.addEventListener("click", () => {
        if (pending) return;
        field.value = prompts[i];
        field.focus();
      });
    });
    reset.addEventListener("click", () => {
      history.replaceChildren();
      history.hidden = true;
      previous = "";
      field.value = "";
      if (endpoint) status.textContent = "";
      field.focus();
    });

    function addMessage(who) {
      const article = document.createElement("article");
      const heading = document.createElement("strong");
      heading.textContent = who === "student" ? "Toi" : "Assistant Stata";
      article.className = who;
      article.append(heading);
      history.hidden = false;
      history.append(article);
      while (history.children.length > 20) history.firstElementChild.remove();
      return article;
    }

    function paragraph(parent, text) {
      const element = document.createElement("p");
      element.textContent = text;
      parent.append(element);
    }

    function showAnswer(data) {
      const article = addMessage("tutor");
      if (data.status !== "answer") {
        paragraph(article, data.message);
        return;
      }
      for (const part of data.sections) {
        paragraph(article, part.text + " " + part.refs.map((ref) => `[${ref}]`).join(" "));
      }
      if (data.code) {
        paragraph(article, "Exemple de code (non exécuté) " + data.codeRefs.map((ref) => `[${ref}]`).join(" "));
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.textContent = data.code;
        pre.append(code);
        article.append(pre);
        const copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "Copier le code";
        copy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(data.code);
            copy.textContent = "Code copié";
          } catch {
            copy.textContent = "Sélectionne le code pour le copier";
          }
        });
        article.append(copy);
      }
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = "Sources citées";
      details.open = true;
      const list = document.createElement("ul");
      for (const source of data.sources) {
        const item = document.createElement("li");
        const label = `[${source.id}] ${source.title}`;
        if (/^https:\/\//i.test(source.url)) {
          const link = document.createElement("a");
          link.href = source.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = label;
          item.append(link);
        } else {
          item.textContent = label;
        }
        item.append(document.createTextNode(" · " + source.kind));
        list.append(item);
      }
      details.append(summary, list);
      article.append(details);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = field.value.trim();
      const code = access.value.trim();
      if (pending || !question) return;
      if (!endpoint) {
        paragraph(addMessage("student"), question);
        const article = addMessage("tutor");
        const sources = retrieve(question).slice(0, 3);
        if (!sources.length) paragraph(article, "Aucune fiche correspondante. Essaie avec le nom d’une commande.");
        for (const source of sources) {
          const link = document.createElement("a");
          link.href = source.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = source.title;
          article.append(link);
          paragraph(article, source.note);
        }
        field.value = "";
        history.scrollTop = history.scrollHeight;
        return;
      }
      if (!code) return;
      pending = true;
      send.disabled = true;
      reset.disabled = true;
      field.readOnly = true;
      status.textContent = "Recherche des sources et préparation de la réponse…";
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + code },
          credentials: "omit",
          redirect: "error",
          body: JSON.stringify({ question, previous }),
          signal: AbortSignal.timeout(60000),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "Le serveur a refusé la requête.");
        paragraph(addMessage("student"), question);
        showAnswer(data);
        if (data.status !== "insufficient") previous = question;
        field.value = "";
        history.scrollTop = history.scrollHeight;
        status.textContent = "";
      } catch (error) {
        status.textContent = error.name === "TimeoutError"
          ? "Le délai de réponse est dépassé. Réessaie."
          : error instanceof TypeError || error instanceof SyntaxError
            ? "Connexion impossible. Vérifie l’URL du serveur et la configuration GitHub Pages."
            : error.message;
      } finally {
        pending = false;
        send.disabled = false;
        reset.disabled = false;
        field.readOnly = false;
      }
    });
  }
}

if (!customElements.get("assistant-stata")) {
  customElements.define("assistant-stata", AssistantStata);
}

  </script>
</body>
</html>
